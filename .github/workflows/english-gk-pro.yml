name: English GK Pro Enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject enhancements and AI CORS fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SSC_2025_ENGLISH_CHAPTERWISE (3).html')
          s=p.read_text(encoding='utf-8')
          for marker, tag in [
              ('english-gk-pro-enhancements.js', '<script src="english-gk-pro-enhancements.js"></script>'),
              ('ai-cors-fix.js', '<script src="ai-cors-fix.js"></script>')
          ]:
              if marker not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit enhancement files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'SSC_2025_ENGLISH_CHAPTERWISE (3).html' english-gk-pro-enhancements.js ai-cors-fix.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix AI CORS for browser requests'
          git push
