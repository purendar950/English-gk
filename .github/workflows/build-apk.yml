name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'android/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.9'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare web app assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/
          cp -r css js data app/src/main/assets/www/

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk English-GK-SSC-Practice.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-GK-SSC-Practice
          path: English-GK-SSC-Practice.apk
          retention-days: 30

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-outputs
          path: app/build/outputs/**
          retention-days: 30
